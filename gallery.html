<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Gallery</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #2a1033; --cream: #fff8e7; --pink: #ff5a8a; --yellow: #ffd61f; }
    * { box-sizing: border-box; margin: 0; }
    body {
      background: var(--yellow);
      color: var(--ink);
      font-family: "Rubik", system-ui, sans-serif;
      font-weight: 500;
      padding: 32px clamp(16px, 4vw, 48px) 64px;
      min-height: 100vh;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 20px;
      margin-bottom: 8px;
    }
    h1 { font-family: "Bagel Fat One", "Rubik", sans-serif; font-weight: 400; font-size: clamp(2rem, 5vw, 3.2rem); }
    .count { font-size: 1.1rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-left: auto; }
    .note { margin-bottom: 28px; max-width: 60ch; }

    button, .btn {
      font: inherit;
      font-weight: 700;
      color: var(--ink);
      background: var(--cream);
      border: 3px solid var(--ink);
      border-radius: 999px;
      box-shadow: 4px 4px 0 var(--ink);
      padding: 10px 18px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    button:hover, .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
    button:active, .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
    button:focus-visible, .btn:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
    button:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: 4px 4px 0 var(--ink); }
    .primary { background: var(--pink); }
    .small { padding: 6px 12px; font-size: 0.9rem; box-shadow: 3px 3px 0 var(--ink); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 28px;
    }
    .card {
      background: var(--cream);
      border: 3px solid var(--ink);
      box-shadow: 6px 6px 0 var(--ink);
      padding: 10px 10px 12px;
    }
    .thumb { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
    .thumb:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
    .card img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: var(--ink); transition: filter 0.15s; }
    .thumb:hover img { filter: brightness(1.08); }

    /* ---------- Quick view ---------- */
    .viewer {
      width: 100vw;
      height: 100vh;
      max-width: none;
      max-height: none;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--ink);
    }
    .viewer::backdrop { background: rgb(42 16 51 / 0.88); }
    .viewer[open] {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: clamp(8px, 2vw, 24px);
      padding: clamp(16px, 3vw, 40px);
    }
    .viewer figure {
      justify-self: center;
      max-width: 100%;
      background: var(--cream);
      border: 3px solid var(--ink);
      box-shadow: 8px 8px 0 var(--ink);
      padding: 12px 12px 14px;
      animation: pop-in 0.25s cubic-bezier(.34, 1.56, .64, 1);
    }
    .viewer img {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 2 * clamp(16px, 3vw, 40px) - 110px);
      background: var(--ink);
    }
    .viewer .meta { font-size: 1.05rem; }
    .round {
      width: 56px;
      height: 56px;
      padding: 0;
      border-radius: 50%;
      font-size: 1.8rem;
      line-height: 1;
      display: grid;
      place-items: center;
    }
    .close-btn { position: absolute; top: clamp(16px, 3vw, 32px); right: clamp(16px, 3vw, 32px); }
    @keyframes pop-in { from { transform: scale(0.92); opacity: 0; } }
    @media (max-width: 600px) {
      .viewer[open] { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr auto; }
      .viewer figure { grid-column: 1 / -1; grid-row: 1; }
      .viewer .prev { grid-row: 2; justify-self: end; }
      .viewer .next { grid-row: 2; justify-self: start; }
    }
    @media (prefers-reduced-motion: reduce) { .viewer figure { animation: none; } }
    .meta { display: flex; justify-content: space-between; gap: 8px; margin: 10px 2px; font-size: 0.95rem; }
    .meta strong { font-weight: 700; }
    .card-actions { display: flex; gap: 10px; }
    .empty { font-size: 1.2rem; padding: 48px 0; }
  </style>
</head>
<body>
  <header>
    <h1>Photos</h1>
    <span class="count" id="count"></span>
    <div class="actions">
      <button class="primary" id="downloadAll" type="button">Download all (.zip)</button>
      <button id="deleteAll" type="button">Delete all</button>
    </div>
  </header>
  <p class="note">Photos from the installation, newest first. They're saved in this browser on this computer only. Download them to keep a copy.</p>
  <main class="grid" id="grid"></main>

  <!-- Quick view: click a photo to see it large. ← → step through, Esc or a click outside closes. -->
  <dialog class="viewer" id="viewer" aria-label="Photo quick view">
    <button class="round prev" id="viewPrev" type="button" aria-label="Previous photo">‹</button>
    <figure>
      <img id="viewImg" alt="">
      <figcaption class="meta"><strong id="viewScene"></strong><span id="viewWhen"></span></figcaption>
      <div class="card-actions">
        <button class="small" id="viewSave" type="button">Download</button>
        <button class="small" id="viewDelete" type="button">Delete</button>
        <span class="view-pos" id="viewPos" style="margin-left:auto;align-self:center"></span>
      </div>
    </figure>
    <button class="round next" id="viewNext" type="button" aria-label="Next photo">›</button>
    <button class="round close-btn" id="viewClose" type="button" aria-label="Close">×</button>
  </dialog>

  <script src="photos-db.js?v=19"></script>
  <script>
    const grid = document.getElementById("grid");
    const countEl = document.getElementById("count");
    const downloadAllBtn = document.getElementById("downloadAll");
    const deleteAllBtn = document.getElementById("deleteAll");
    let photos = [];
    let urls = [];  // image address for each photo, same order as photos
    let whens = []; // readable time for each photo

    const pad = (n) => String(n).padStart(2, "0");
    function fileName(p) {
      const d = new Date(p.time);
      const stamp = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}-${pad(d.getSeconds())}`;
      const scene = (p.scene || "photo").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      return `${stamp}_${scene}_${p.id}.jpg`;
    }

    function download(blob, name) {
      const url = URL.createObjectURL(blob);
      const a = Object.assign(document.createElement("a"), { href: url, download: name });
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }

    async function render() {
      photos = (await PhotoDB.all()).sort((a, b) => b.time - a.time);
      urls.forEach(URL.revokeObjectURL);
      urls = photos.map((p) => URL.createObjectURL(p.blob));
      whens = photos.map((p) => new Date(p.time).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit", second: "2-digit" }));
      countEl.textContent = `${photos.length} photo${photos.length === 1 ? "" : "s"}`;
      downloadAllBtn.disabled = deleteAllBtn.disabled = !photos.length;
      refreshViewer();

      if (!photos.length) {
        grid.innerHTML = '<p class="empty">No photos yet. They appear here as the installation takes them.</p>';
        return;
      }
      grid.replaceChildren(...photos.map((p, i) => {
        const url = urls[i], when = whens[i];
        const card = document.createElement("figure");
        card.className = "card";
        card.innerHTML = `
          <button class="thumb" type="button" aria-label="View larger"><img alt=""></button>
          <figcaption class="meta"><strong></strong><span></span></figcaption>
          <div class="card-actions">
            <button class="small" type="button" data-act="save">Download</button>
            <button class="small" type="button" data-act="delete">Delete</button>
          </div>`;
        card.querySelector("img").src = url;
        card.querySelector("img").alt = `Photo for "${p.scene}", ${when}`;
        card.querySelector("strong").textContent = p.scene || "Photo";
        card.querySelector(".meta span").textContent = when;
        card.querySelector(".thumb").onclick = () => openViewer(p.id);
        card.querySelector('[data-act="save"]').onclick = () => download(p.blob, fileName(p));
        card.querySelector('[data-act="delete"]').onclick = () => deletePhoto(p);
        return card;
      }));
    }

    async function deletePhoto(p) {
      if (confirm("Delete this photo? This can't be undone.")) { await PhotoDB.remove(p.id); render(); }
    }

    /* ---------- Quick view ---------- */
    const viewer = document.getElementById("viewer");
    const viewImg = document.getElementById("viewImg");
    let viewingId = null; // which photo the quick view shows (kept by id so it survives a refresh)

    function openViewer(id) {
      viewingId = id;
      refreshViewer();
      if (!viewer.open) viewer.showModal();
    }

    // Show the current photo, or close if it's gone (deleted here or in another tab)
    function refreshViewer() {
      if (viewingId === null) return;
      const i = photos.findIndex((p) => p.id === viewingId);
      if (i < 0) { viewer.close(); return; }
      const p = photos[i];
      viewImg.src = urls[i];
      viewImg.alt = `Photo for "${p.scene}", ${whens[i]}`;
      document.getElementById("viewScene").textContent = p.scene || "Photo";
      document.getElementById("viewWhen").textContent = whens[i];
      document.getElementById("viewPos").textContent = `${i + 1} / ${photos.length}`;
      document.getElementById("viewPrev").disabled = i === 0;
      document.getElementById("viewNext").disabled = i === photos.length - 1;
    }

    function step(by) {
      const i = photos.findIndex((p) => p.id === viewingId) + by;
      if (i >= 0 && i < photos.length) { viewingId = photos[i].id; refreshViewer(); }
    }

    document.getElementById("viewPrev").onclick = () => step(-1);
    document.getElementById("viewNext").onclick = () => step(1);
    document.getElementById("viewClose").onclick = () => viewer.close();
    document.getElementById("viewSave").onclick = () => {
      const p = photos.find((x) => x.id === viewingId);
      if (p) download(p.blob, fileName(p));
    };
    document.getElementById("viewDelete").onclick = async () => {
      const i = photos.findIndex((p) => p.id === viewingId);
      if (i < 0 || !confirm("Delete this photo? This can't be undone.")) return;
      const after = photos[i + 1] ?? photos[i - 1]; // show a neighbour next
      await PhotoDB.remove(viewingId);
      viewingId = after ? after.id : null;
      if (!after) viewer.close();
      render();
    };
    viewer.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") step(-1);
      else if (e.key === "ArrowRight") step(1);
    });
    // A click on the dark area around the photo closes the quick view
    viewer.addEventListener("click", (e) => { if (e.target === viewer) viewer.close(); });
    viewer.addEventListener("close", () => { viewingId = null; });

    downloadAllBtn.onclick = async () => {
      downloadAllBtn.disabled = true;
      downloadAllBtn.textContent = "Zipping…";
      try {
        const zip = await makeZip(photos.map((p) => ({ name: fileName(p), blob: p.blob, time: p.time })));
        const d = new Date();
        download(zip, `silhouette-photos_${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.zip`);
      } finally {
        downloadAllBtn.textContent = "Download all (.zip)";
        downloadAllBtn.disabled = !photos.length;
      }
    };

    deleteAllBtn.onclick = async () => {
      if (confirm(`Delete all ${photos.length} photos? This can't be undone. Download them first if you want to keep them.`)) {
        await PhotoDB.clear();
        render();
      }
    };

    // Refresh when the installation (in another tab) saves a photo
    PhotoDB.onChange(render);
    render();

    /* ---------- Zip file (no compression; JPEGs are already compressed) ---------- */
    const CRC_TABLE = Array.from({ length: 256 }, (_, n) => {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      return c >>> 0;
    });
    function crc32(bytes) {
      let crc = 0xffffffff;
      for (let i = 0; i < bytes.length; i++) crc = CRC_TABLE[(crc ^ bytes[i]) & 0xff] ^ (crc >>> 8);
      return (crc ^ 0xffffffff) >>> 0;
    }
    function dosDateTime(ms) {
      const d = new Date(ms);
      return [
        (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1),
        ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate(),
      ];
    }
    async function makeZip(files) {
      const enc = new TextEncoder();
      const parts = [], central = [];
      let offset = 0;
      for (const f of files) {
        const data = new Uint8Array(await f.blob.arrayBuffer());
        const name = enc.encode(f.name);
        const crc = crc32(data);
        const [time, date] = dosDateTime(f.time);

        const local = new DataView(new ArrayBuffer(30));
        local.setUint32(0, 0x04034b50, true);
        local.setUint16(4, 20, true);
        local.setUint16(10, time, true);
        local.setUint16(12, date, true);
        local.setUint32(14, crc, true);
        local.setUint32(18, data.length, true);
        local.setUint32(22, data.length, true);
        local.setUint16(26, name.length, true);
        parts.push(local, name, data);

        const entry = new DataView(new ArrayBuffer(46));
        entry.setUint32(0, 0x02014b50, true);
        entry.setUint16(4, 20, true);
        entry.setUint16(6, 20, true);
        entry.setUint16(12, time, true);
        entry.setUint16(14, date, true);
        entry.setUint32(16, crc, true);
        entry.setUint32(20, data.length, true);
        entry.setUint32(24, data.length, true);
        entry.setUint16(28, name.length, true);
        entry.setUint32(42, offset, true);
        central.push(entry, name);

        offset += 30 + name.length + data.length;
      }
      const size = central.reduce((n, p) => n + p.byteLength, 0);
      const end = new DataView(new ArrayBuffer(22));
      end.setUint32(0, 0x06054b50, true);
      end.setUint16(8, files.length, true);
      end.setUint16(10, files.length, true);
      end.setUint32(12, size, true);
      end.setUint32(16, offset, true);
      return new Blob([...parts, ...central, end], { type: "application/zip" });
    }
  </script>
</body>
</html>
