<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Match the Silhouette — Coming Soon</title>
  <meta name="description" content="A playful DES 225 installation where you match silhouettes on the wall. Coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
  <!-- Bump ?v= after each change so browsers load the new files instead of an old copy -->
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
  <!-- "Line boil" wobble, like the Unity shader: noise nudges the edges, and a new noise
       pattern every ~0.2s (script.js) makes the art twitch like hand-drawn animation -->
  <svg class="filters" aria-hidden="true" focusable="false">
    <filter id="boil-bg" x="0" y="0" width="100%" height="100%">
      <feTurbulence class="boil-noise" type="fractalNoise" baseFrequency="0.006" numOctaves="1" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="boil-fig" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence class="boil-noise" type="fractalNoise" baseFrequency="0.025" numOctaves="1" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <div class="bg" aria-hidden="true"></div>

  <main class="stage" id="stage" aria-label="Silhouettes to match"></main>

  <footer class="bottom">
    <div class="timer" id="timer" role="timer" aria-label="Time left in this scene">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle class="track" cx="32" cy="32" r="27"/>
        <circle class="ring" id="timerRing" cx="32" cy="32" r="27"/>
      </svg>
      <span id="timerText">30</span>
    </div>
  </footer>

  <button class="fs-btn" id="fsBtn" type="button" aria-label="Enter fullscreen" title="Fullscreen (F)">
    <svg class="icon-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    <svg class="icon-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
  </button>

  <script src="icons.js?v=11"></script>
  <script src="scenes.js?v=11"></script>
  <script src="script.js?v=11"></script>
</body>
</html>
